#     cross_boresight_arcsec_1sigma: 6.0
#     roll_arcsec_1sigma: 40.0
#     rate_hz: 5.0
#   gyro:                            # small-spacecraft state of the art [NASA-SoA]
#     bias_stability_deg_h: 0.15
#     arw_deg_sqrt_h: 0.02
