# Coupled rigid-body test scenario; all changes below are project assumptions.
# The same principal inertias are rotated into body axes with fixed xyz angles [15,-20,25] deg.
# J is constant during the run. Nonzero initial body and wheel momentum activates gyroscopic coupling.
# Initial attitude: 20 deg about [1,1,-1]. Initial body rates: [0.2,-0.15,0.1] deg/s.
# No external disturbances, sensor noise, flexible modes, or inertia uncertainty are added.
