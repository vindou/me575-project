# The target is an absolute body-to-inertial attitude, not an incremental turn.
# The axis is normalized by the runner. The angle is in degrees.
target:
  axis: [0.0, 0.0, 1.0]
  angle_deg: 50.0

# Names must match CONTROLLERS in cubesat_sim/controller.py.
# Parameter names must match the corresponding factory's arguments.
controllers:
  pd:
    # Recompute Kp = wn_rad_s**2 * J and Kd = 2*zeta*wn_rad_s * J at startup.
    # This local design does not automatically enforce slew-rate or wheel limits.
    wn_rad_s: 0.2
    zeta: 1.0
  mpc:
    # Nonlinear shooting MPC (cubesat_sim/mpc.py). Replans every control interval with
    # L-BFGS over a horizon of horizon_steps * control_interval_s seconds.
    control_interval_s: 0.2
    horizon_steps: 25
    iterations: 10
    first_iterations: 50
    rate_weight_s: 1.0
    w_torque: 1.0e-4
    w_terminal: 10.0
    # Soft slew-rate limit. null disables it: at 0.5 deg/s this 50 deg slew needs about
    # 100 s, longer than the 60 s default run. The coupled files enable it.
    max_rate_deg_s: null
    momentum_warning_frac: 0.8
  mppi:
    # Sampling-based MPPI (cubesat_sim/mppi.py) with the same cost as mpc. Each replan
    # runs `iterations` rounds of `samples` rollouts with sigma annealed from noise_sigma
    # to final_sigma_fraction * noise_sigma.
    control_interval_s: 0.2
    horizon_steps: 10
    samples: 256
    iterations: 8
    first_iterations: 40
    noise_sigma: 0.1
    final_sigma_fraction: 0.01
    temperature: 0.01
    seed: 0
    rate_weight_s: 1.0
    w_torque: 1.0e-4
    w_terminal: 10.0
    max_rate_deg_s: null
    momentum_warning_frac: 0.8
